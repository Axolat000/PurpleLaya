name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LOSSLESS_USER_AGENT=${{ vars.LOSSLESS_USER_AGENT }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
        echo "SIGNATURE_API_URL=${{ secrets.SIGNATURE_API_URL }}" >> local.properties
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > laya-release.jks
          {
            echo "storeFile=laya-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        else
          keytool -genkeypair \
            -v \
            -keystore laya-release.jks \
            -storetype PKCS12 \
            -alias purplelaya \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass purplelaya123 \
            -keypass purplelaya123 \
            -dname "CN=PurpleLaya, OU=Axolat000, O=PurpleMusic, L=Paris, ST=IDF, C=FR"
          {
            echo "storeFile=laya-release.jks"
            echo "storePassword=purplelaya123"
            echo "keyAlias=purplelaya"
            echo "keyPassword=purplelaya123"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laya-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laya-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
